<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACERWC 48th Ordinary Session — Program of Work</title>
<style>
  :root {
    --maroon: #00754a;
    --maroon-dark: #005838;
    --green: #00754a;
    --green-dark: #005838;
    --gold: #c9a85f;
    --gold-dark: #977e47;
    --tint-open: #e6f1ed;
    --tint-closed: #ebf4f1;
    --tint-parallel: #f9f5ec;
    --ink: #2a2028;
    --muted: #6b5d63;
    --bg: #fbf9f7;
    --card: #ffffff;
    --border: #e9e0e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header.top { background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%); color: #fff; padding: 28px 24px 22px; }
  .top-inner { max-width: 1100px; margin: 0 auto; }
  .logo-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo-row img { height: 52px; width: auto; display: block; }
  .hashtag { text-align: center; font-weight: 700; letter-spacing: 0.08em; color: var(--gold); font-size: 0.85rem; margin-bottom: 6px; }
  h1.title { text-align: center; font-size: 1.7rem; margin: 0 0 6px; font-weight: 700; }
  p.subtitle { text-align: center; margin: 0 0 18px; color: #f2dfe3; font-size: 0.98rem; }
  .chips { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 6px 14px; font-size: 0.88rem; }
  .lang-toggle { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .lang-toggle button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 5px 16px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; }
  .lang-toggle button.active { background: #fff; color: var(--maroon-dark); border-color: #fff; }
  nav.tabs { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; }
  nav.tabs button { flex: 1 0 auto; min-width: 120px; padding: 14px 10px; border: none; background: transparent; font-size: 0.92rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav.tabs button.active { color: var(--maroon); border-bottom-color: var(--maroon); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  section.panel { display: none; }
  section.panel.active { display: block; }
  h2.panel-title { font-size: 1.3rem; margin: 0 0 6px; color: var(--maroon-dark); }
  p.panel-intro { color: var(--muted); margin: 0 0 22px; max-width: 760px; }
  .day-switch { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .day-switch button { padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-weight: 600; font-size: 0.88rem; cursor: pointer; color: var(--ink); }
  .day-switch button.active { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .rest-note { font-size: 0.82rem; color: var(--muted); margin: -12px 0 20px; font-style: italic; }
  .day-panel { display: none; }
  .day-panel.active { display: block; }
  .block-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; display: flex; gap: 16px; align-items: flex-start; }
  .block-time { flex: 0 0 120px; font-weight: 700; color: var(--maroon-dark); font-size: 0.92rem; }
  .block-body { flex: 1; min-width: 0; }
  .block-track { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gold-dark); margin-bottom: 4px; }
  .block-title { font-weight: 700; margin-bottom: 6px; }
  .block-items { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.9rem; }
  .block-items li { margin-bottom: 3px; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; margin-top: 2px; }
  .badge.open { background: var(--tint-open); color: var(--green-dark); }
  .badge.closed { background: var(--tint-closed); color: var(--maroon-dark); }
  .badge.closed-parallel { background: var(--tint-parallel); color: var(--gold-dark); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .map-embed { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 14px; }
  .map-embed iframe { width: 100%; height: 380px; border: 0; display: block; }
  .btn { display: inline-block; background: var(--maroon); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
  .note { background: var(--tint-parallel); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 16px; font-size: 0.87rem; color: var(--gold-dark); margin-top: 14px; }
  .speaker-name { font-weight: 700; }
  .placeholder { color: var(--muted); font-style: italic; }
  footer.bottom { background: var(--maroon-dark); color: #f2dfe3; text-align: center; padding: 22px; font-size: 0.85rem; }
  footer.bottom img { height: 34px; margin-bottom: 10px; }
  ul.link-list { list-style: none; padding: 0; margin: 0; }
  ul.link-list li { margin-bottom: 10px; }
  ul.link-list a { color: var(--maroon); font-weight: 600; text-decoration: none; }
  ul.link-list a:hover { text-decoration: underline; }
  @media (max-width: 640px) { .block-card { flex-direction: column; gap: 6px; } .block-time { flex: none; } }
</style>
</head>

  const tabButtons = document.querySelectorAll('nav.tabs button');
  const panels = document.querySelectorAll('section.panel');
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      setTimeout(sendHeightToParent, 60);
    });
  });

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  function badgeLabelPublic(access, lang) {
    return (CHROME[lang].badges[access]) || access;
  }

  function renderAgendaPublic(lang) {
    const switchEl = document.getElementById('day-switch');
    const panelsEl = document.getElementById('day-panels');
    switchEl.innerHTML = '';
    panelsEl.innerHTML = '';
    const agenda = DATA[lang].agenda;
    agenda.forEach((day, idx) => {
      const dayBtn = document.createElement('button');
      dayBtn.textContent = day.weekday + ' ' + day.date.split(' ')[0];
      dayBtn.dataset.day = day.id;
      if (idx === 0) dayBtn.classList.add('active');
      dayBtn.addEventListener('click', () => {
        document.querySelectorAll('.day-switch button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
        dayBtn.classList.add('active');
        document.getElementById('daypanel-' + day.id).classList.add('active');
        setTimeout(sendHeightToParent, 60);
      });
      switchEl.appendChild(dayBtn);

      const dayPanel = document.createElement('div');
      dayPanel.className = 'day-panel' + (idx === 0 ? ' active' : '');
      dayPanel.id = 'daypanel-' + day.id;

      const heading = document.createElement('h3');
      heading.style.marginTop = '0';
      heading.textContent = day.weekday + ', ' + day.date;
      dayPanel.appendChild(heading);

      day.blocks.forEach(block => {
        const card = document.createElement('div');
        card.className = 'block-card';

        const timeEl = document.createElement('div');
        timeEl.className = 'block-time';
        timeEl.textContent = block.time;
        card.appendChild(timeEl);

        const bodyEl = document.createElement('div');
        bodyEl.className = 'block-body';

        if (block.track) {
          const trackEl = document.createElement('div');
          trackEl.className = 'block-track';
          trackEl.textContent = block.track;
          bodyEl.appendChild(trackEl);
        }

        const titleEl = document.createElement('div');
        titleEl.className = 'block-title';
        titleEl.textContent = block.title;
        bodyEl.appendChild(titleEl);

        if (block.items && block.items.length) {
          const ul = document.createElement('ul');
          ul.className = 'block-items';
          block.items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          });
          bodyEl.appendChild(ul);
        }

        const badge = document.createElement('span');
        badge.className = 'badge ' + block.access;
        badge.textContent = badgeLabelPublic(block.access, lang);
        bodyEl.appendChild(document.createElement('br'));
        bodyEl.appendChild(badge);

        card.appendChild(bodyEl);
        dayPanel.appendChild(card);
      });

      panelsEl.appendChild(dayPanel);
    });
  }

  function renderPublic(lang) {
    document.documentElement.lang = lang;
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');

    const d = DATA[lang];
    const c = CHROME[lang];
    const m = d.meta;

    document.getElementById('txt-hashtag').textContent = m.hashtag;
    document.getElementById('txt-title').textContent = m.title;

    tabButtons.forEach(btn => { btn.textContent = c.tabs[btn.dataset.tab]; });

    document.getElementById('txt-venue-title').textContent = c.panelTitles.venue;
    document.getElementById('txt-venue-intro').textContent = c.venueIntroPrefix + m.venueName + c.venueIntroMid + m.venueCity + '.';
    document.getElementById('map-iframe').src = m.mapEmbedUrl;

    const dirBtn = document.getElementById('btn-directions');

    document.getElementById('txt-venue-note').textContent = m.venueChangeNote;

    document.getElementById('txt-speakers-title').textContent = c.panelTitles.speakers;
    document.getElementById('txt-speakers-intro').textContent = m.speakersIntro;
    document.getElementById('txt-speakers-section').textContent = m.speakersSectionTitle;
    document.getElementById('speakers-list').innerHTML = (d.speakers || []).map(sp =>
      '<li><span class="speaker-name">' + esc(sp.name) + '</span>' + (sp.role ? ' — ' + esc(sp.role) : '') + '</li>'
    ).join('');
    document.getElementById('txt-speakers-note').textContent = m.speakersNote;

    document.getElementById('txt-documents-title').textContent = c.panelTitles.documents;
    document.getElementById('txt-documents-intro').textContent = m.documentsIntro;
    const docsEl = document.getElementById('documents-body');
    if (d.documents && d.documents.length) {
      docsEl.innerHTML = '<ul class="link-list">' + d.documents.map(doc => {
        const href = doc.fileData || doc.url || '#';
        const dl = doc.fileData ? ' download="' + esc(doc.fileName || doc.title || 'document') + '"' : '';
        return '<li><a href="' + href + '" target="_blank" rel="noopener"' + dl + '>' + esc(doc.title || c.untitledDocument) + '</a></li>';
      }).join('') + '</ul>';
    } else {
      docsEl.innerHTML = '<p class="placeholder">' + esc(m.documentsPlaceholder) + '</p>';
    }

    document.getElementById('txt-practical-title').textContent = c.panelTitles.practical;
    document.getElementById('txt-practical-intro').textContent = m.practicalIntro;
    document.getElementById('practical-body').innerHTML = (d.practicalInfo || []).map(p =>
      '<p><strong>' + esc(p.label) + ':</strong> <span' + (p.value ? '' : ' class="placeholder"') + '>' + esc(p.value || c.toBeConfirmed) + '</span></p>'
    ).join('');

    document.getElementById('txt-online-title').textContent = c.panelTitles.online;
    document.getElementById('txt-online-intro').textContent = m.onlineIntro;
    document.getElementById('online-list').innerHTML = (d.onlineLinks || []).map(l =>
      '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></li>'
    ).join('');
    document.getElementById('txt-online-note').textContent = m.onlineNote;

    document.getElementById('txt-footer-org').textContent = c.footerOrg;
    document.getElementById('txt-footer-addr').textContent = c.footerAddr;

    renderAgendaPublic(lang);
    setTimeout(sendHeightToParent, 60);
  }

  document.getElementById('lang-en').addEventListener('click', () => renderPublic('en'));
  document.getElementById('lang-fr').addEventListener('click', () => renderPublic('fr'));

  function sendHeightToParent() {
    const h = document.documentElement.scrollHeight;
    window.parent.postMessage({ source: 'acerwc48-embed', height: h }, '*');
  }
  window.addEventListener('load', sendHeightToParent);
  window.addEventListener('resize', sendHeightToParent);
  setTimeout(sendHeightToParent, 300);
  setTimeout(sendHeightToParent, 1000);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => sendHeightToParent());
    ro.observe(document.body);
  }

  renderPublic('en');
</script>

</body>
</html>
